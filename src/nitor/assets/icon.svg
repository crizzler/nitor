<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nitor's own mark: a four-point spark on a dark tile. It deliberately shares nothing with NZXT's
  logo, and it is drawn from two shapes so that it stays legible at 16px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="spark" x1="24" y1="7" x2="24" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#0091EA"/>
    </linearGradient>
    <radialGradient id="halo" cx="24" cy="24" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00AAFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00AAFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="48" height="48" rx="11" fill="#101418"/>
  <circle cx="24" cy="24" r="15" fill="url(#halo)"/>
  <path d="M24 5 C26.4 17 31 21.6 43 24 C31 26.4 26.4 31 24 43 C21.6 31 17 26.4 5 24 C17 21.6 21.6 17 24 5 Z"
        fill="url(#spark)"/>
  <circle cx="24" cy="24" r="3.4" fill="#EAF8FF"/>
</svg>
